services:
  travelshaper:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      # Map host.docker.internal to the host's gateway so the container can
      # reach the Observe Agent running on the host. Docker Desktop and
      # Podman 4.7+ resolve this name automatically on Mac/Windows, but on
      # Linux (Docker Engine, older Podman) the mapping must be declared
      # here. host-gateway is a special value resolved at runtime.
      - "host.docker.internal:host-gateway"
    environment:
      # Traceloop / Observe Agent — agent runs on the host and receives OTLP.
      # Default protocol is HTTP/protobuf on port 4318. To switch to gRPC,
      # set OTEL_EXPORTER_OTLP_PROTOCOL=grpc; the gRPC endpoint defaults to
      # host.docker.internal:4317 below, override only if your agent listens
      # elsewhere.
      TRACELOOP_BASE_URL: ${TRACELOOP_BASE_URL:-http://host.docker.internal:4318}
      TRACELOOP_TRACE_CONTENT: ${TRACELOOP_TRACE_CONTENT:-true}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      # App-level resource attributes. Infra attributes (deployment.environment,
      # host.name, cluster IDs) are set on the Observe Agent's resource processor.
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=0.3.0}
      # Debug
      TRAVELSHAPER_DEBUG: ${TRAVELSHAPER_DEBUG:-false}
    volumes:
      # Observe Agent on the host tails ./logs/travelshaper.log.
      # The :z label tells SELinux this bind mount is shared, which is
      # required on RHEL/Fedora rootless Podman; on Docker (Mac/Windows
      # /non-SELinux Linux) the suffix is a harmless no-op.
      - ./logs:/app/logs:z
    restart: unless-stopped
