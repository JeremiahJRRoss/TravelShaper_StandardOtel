services:
  travelshaper:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Traceloop / Observe Agent — agent runs on the host and receives OTLP
      # traces on port 4318. host.docker.internal resolves to the host on
      # Docker Desktop (Mac/Windows); on Linux pass --add-host or override.
      TRACELOOP_BASE_URL: ${TRACELOOP_BASE_URL:-http://host.docker.internal:4318}
      TRACELOOP_TRACE_CONTENT: ${TRACELOOP_TRACE_CONTENT:-true}
      # App-level resource attributes. Infra attributes (deployment.environment,
      # host.name, cluster IDs) are set on the Observe Agent's resource processor.
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=0.3.0}
      # Debug
      TRAVELSHAPER_DEBUG: ${TRAVELSHAPER_DEBUG:-false}
    volumes:
      # Observe Agent on the host tails ./logs/travelshaper.log
      - ./logs:/app/logs
    restart: unless-stopped
